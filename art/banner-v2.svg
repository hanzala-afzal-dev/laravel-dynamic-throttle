<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic Throttle for Laravel</title>
  <desc id="desc">Requests enter a Laravel app, limited per IP, user, token, header or tenant. After routing and authentication, Dynamic Throttle lets the allowed requests on to the controllers and database, and the excess leaves the app as a 429.</desc>
