version: 2

# Every update goes to develop, which collects the pull requests; main takes only releases
# (ADR-0032). Dependabot reads this file from main, the default branch, so this takes
# effect with the first release after it.
updates:
  # Keeps the SHA-pinned actions in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore
      include: scope

  # The dashboard's toolchain (ADR-0028). Majors open on their own, so one
  # that breaks the build does not hold back the rest.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      dashboard:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  # The documentation site (ADR-0029).
  - package-ecosystem: npm
    directory: /docs
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      docs-site:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /docker/php
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
