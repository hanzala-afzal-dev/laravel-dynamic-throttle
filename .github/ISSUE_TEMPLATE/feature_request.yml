name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the non-goals in the README and docs/adr/0001-scope-and-positioning.md first.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the package to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
