name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review too: mutation testing waits until a pull request leaves draft (ADR-0016).
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Nightly full matrix (ADR-0016).
    - cron: '17 3 * * *'
    # Weekly mutation testing of the whole engine, while the nightly run is off (ADR-0016).
    # Keep in step with WEEKLY in the matrix job.
    - cron: '47 3 * * 1'
  workflow_dispatch:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Pick the test matrix
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.pick.outputs.run }}
      tests: ${{ steps.pick.outputs.tests }}
      mutation: ${{ steps.pick.outputs.mutation }}
      mutation_paths: ${{ steps.pick.outputs.mutation_paths }}
    steps:
      # Only pull requests need the code here, to see what they change in the engine. Their
      # checkout is their merge into the base branch, so HEAD^1 is the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          WEEKLY: '47 3 * * 1'
          DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          private=false
          if [ "$EVENT" = "schedule" ]; then
            private="$(gh api "repos/$REPOSITORY" --jq .private)"
          fi

          # The nightly run only happens while the repository is public: on a private
          # repository the full matrix every night would use most of the free Actions minutes.
          # The weekly run is mutation testing only.
          run=true
          if [ "$EVENT" = "schedule" ] && { [ "$private" = "true" ] || [ "$SCHEDULE" = "$WEEKLY" ]; }; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

          # ADR-0016: pull requests test the lowest and the highest supported versions;
          # pushes to main, nightly and manual runs test the full matrix.
          if [ "$EVENT" = "pull_request" ]; then
            tests='{"include":[{"php":"8.3","laravel":"12","stability":"prefer-lowest"},{"php":"8.5","laravel":"13","stability":"prefer-stable"}]}'
          else
            tests='{"php":["8.3","8.4","8.5"],"laravel":["12","13"],"stability":["prefer-lowest","prefer-stable"]}'
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

          # ADR-0016: once it leaves draft, a pull request mutates the engine files it changes
          # and those its changed tests cover ("files"), or the whole engine when it changes
          # what every test runs on ("full"); scripts/mutation-paths.sh decides. The whole
          # engine is also mutated nightly while the repository is public, weekly while it is
          # private, and on manual runs. Pushes to main skip it: the merged pull request passed it.
          mutation=false
          paths=
          if [ "$EVENT" = "pull_request" ]; then
            if [ "$DRAFT" = "true" ]; then
              echo "A draft: mutation testing waits until it is ready for review."
            else
              paths="$(scripts/mutation-paths.sh HEAD^1 HEAD)"
              case "$paths" in
                none) paths= ;;
                full) mutation=full; paths= ;;
                *) mutation=files ;;
              esac
            fi
          elif [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "$WEEKLY" ]; then
              if [ "$private" = "true" ]; then mutation=full; fi
            elif [ "$private" != "true" ]; then
              mutation=full
            fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            mutation=full
          fi
          echo "mutation=$mutation" >> "$GITHUB_OUTPUT"
          echo "mutation_paths=$paths" >> "$GITHUB_OUTPUT"

  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: apcu, bcmath, intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      # --with intersects with the constraint in composer.json instead of replacing it,
      # so the prefer-lowest job installs the floor that users can actually install.
      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          STABILITY: ${{ matrix.stability }}
        run: composer update "--${STABILITY}" --with "laravel/framework:^${LARAVEL}.0" --prefer-dist --no-interaction --no-progress

      - name: Show resolved versions
        run: composer show --no-ansi | grep -E '^(laravel/framework|orchestra/testbench |pestphp/pest |phpunit/phpunit) '

      - name: Lowest Laravel equals the declared floor (ADR-0019)
        if: matrix.stability == 'prefer-lowest'
        env:
          LARAVEL: ${{ matrix.laravel }}
        run: php scripts/check-laravel-floor.php "$LARAVEL"

      - name: Run tests
        run: composer test

      # With APCu enabled in the CLI, which the suite above leaves off (SPEC-012).
      - name: Run the APCu tests
        run: composer test:apcu

  drivers:
    name: Drivers · PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '12', stability: prefer-lowest }
          - { php: '8.5', laravel: '13', stability: prefer-stable }
    # Same images and ports as docker-compose.yml, so the tests need no extra configuration.
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      memcached:
        image: memcached:1.6-alpine
        ports: ['11211:11211']
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dynamic_throttle
          MYSQL_USER: throttle
          MYSQL_PASSWORD: secret
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports: ['3307:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uthrottle -psecret"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dynamic_throttle
          POSTGRES_USER: throttle
          POSTGRES_PASSWORD: secret
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U throttle -d dynamic_throttle"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, intl, memcached, pcntl, pdo_mysql, pdo_pgsql, redis
          coverage: none
          tools: composer:v2

      - name: Fail if a driver extension is missing
        run: php -r 'foreach (["memcached", "pdo_mysql", "pdo_pgsql", "redis"] as $e) { if (! extension_loaded($e)) { fwrite(STDERR, "Missing ext-$e\n"); exit(1); } }'

      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          STABILITY: ${{ matrix.stability }}
        run: composer update "--${STABILITY}" --with "laravel/framework:^${LARAVEL}.0" --prefer-dist --no-interaction --no-progress

      - name: Run driver tests
        run: composer test:drivers

  # ADR-0016: mutation testing of the whole of src/Engine, in three parts that run at
  # once, so the slowest one sets the wait. Each part must reach 85% on its own, which is
  # stricter than one score for the whole engine.
  mutation-stores:
    name: Mutation testing · ${{ matrix.store }}
    needs: matrix
    if: needs.matrix.outputs.mutation == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the --ignore list of mutation-engine, so every file is tested once.
        include:
          - { store: Redis store, path: src/Engine/Stores/RedisLimiterStore.php }
          - { store: cache store, path: src/Engine/Stores/CacheLimiterStore.php }
    # The stores are only exercised against real services, as in the driver job.
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      memcached:
        image: memcached:1.6-alpine
        ports: ['11211:11211']
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dynamic_throttle
          MYSQL_USER: throttle
          MYSQL_PASSWORD: secret
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports: ['3307:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uthrottle -psecret"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dynamic_throttle
          POSTGRES_USER: throttle
          POSTGRES_PASSWORD: secret
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U throttle -d dynamic_throttle"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, memcached, pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite, redis
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Mutation score of at least 85% for the ${{ matrix.store }}
        env:
          DYNAMIC_THROTTLE_DRIVERS: '1'
          MUTATE_PATH: ${{ matrix.path }}
        run: vendor/bin/pest --exclude-group=concurrency --mutate --everything --path="$MUTATE_PATH" --min=85 --parallel

  # Everything but the two stores, without the services, as `composer test` runs: the
  # driver tests, which only cover the stores, are left out, and the contract suite uses
  # its in-memory stores. The score is the same as with the services.
  mutation-engine:
    name: Mutation testing · the rest of the engine
    needs: matrix
    if: needs.matrix.outputs.mutation == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, memcached, pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite, redis
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Mutation score of at least 85% for the rest of src/Engine
        # One --exclude-group only: Pest 4, which PHP 8.3 installs, ignores a second one. The
        # concurrency tests are all in tests/Drivers, so they are left out with the rest.
        run: vendor/bin/pest --exclude-group=drivers --mutate --everything --path=src/Engine --ignore=src/Engine/Stores/RedisLimiterStore.php,src/Engine/Stores/CacheLimiterStore.php --min=85 --parallel

  # ADR-0016: a pull request's mutation run, of the engine files it changes and those its
  # changed tests cover, with the driver tests and their services. An engine file's own
  # tests can be driver tests: without them, the Redis telemetry buffer scores below 85%.
  mutation-changed:
    name: Mutation testing · the changed engine files
    needs: matrix
    if: needs.matrix.outputs.mutation == 'files'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      memcached:
        image: memcached:1.6-alpine
        ports: ['11211:11211']
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dynamic_throttle
          MYSQL_USER: throttle
          MYSQL_PASSWORD: secret
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports: ['3307:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uthrottle -psecret"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dynamic_throttle
          POSTGRES_USER: throttle
          POSTGRES_PASSWORD: secret
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U throttle -d dynamic_throttle"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, memcached, pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite, redis
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # A file with nothing to mutate, such as an interface, passes rather than scoring 0%.
      - name: Mutation score of at least 85% for the changed engine files
        env:
          DYNAMIC_THROTTLE_DRIVERS: '1'
          MUTATE_PATHS: ${{ needs.matrix.outputs.mutation_paths }}
        run: |
          echo "Mutating: $MUTATE_PATHS"
          vendor/bin/pest --exclude-group=concurrency --mutate --everything --path="$MUTATE_PATHS" --min=85 --ignore-min-score-on-zero-mutations --parallel

  static-analysis:
    name: Larastan
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Larastan
        run: composer analyse -- --error-format=github

  code-style:
    name: Code style and repository rules
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: composer format:check

      - name: Rector
        run: composer refactor:check

      # What `composer require` downloads is `git archive` of the tag, filtered by the
      # export-ignore rules in .gitattributes. Users get the package, nothing else.
      - name: The Composer download contains only package files
        run: |
          allowed='^(src|config|database|resources|routes|lang|dist)/|^(composer\.json|LICENSE|README\.md|CHANGELOG\.md|SECURITY\.md)$'
          unexpected="$(git archive HEAD | tar -t | grep -v '/$' | grep -v -E "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::These files would ship to users. Add them to export-ignore in .gitattributes, or to this allowlist if users need them:"
            echo "$unexpected"
            exit 1
          fi

      # ADR-0028: users get the dashboard's build, never its sources or its toolchain.
      - name: The Composer download holds the dashboard's build and none of its sources
        run: |
          files="$(git archive HEAD | tar -t)"
          if ! echo "$files" | grep -q '^dist/\.vite/manifest\.json$'; then
            echo "::error::dist/.vite/manifest.json is not in the Composer download: run npm run build and commit dist/."
            exit 1
          fi
          leaked="$(echo "$files" | grep -E '^(resources/dashboard/|package(-lock)?\.json$|vite\.config\.ts$|tsconfig\.json$|node_modules/)' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::The dashboard's sources or toolchain would ship to users: $leaked"
            exit 1
          fi

  # ADR-0028: the dashboard's frontend. dist/ is committed, so the build must be
  # what the sources build, within its budget, with no known high advisory shipped.
  frontend:
    name: Dashboard frontend
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: The committed build is what the sources build
        run: |
          npm run build
          changed="$(git status --porcelain -- dist)"
          if [ -n "$changed" ]; then
            echo "::error::dist/ differs from a fresh build: run npm run build and commit dist/."
            echo "$changed"
            exit 1
          fi

      - name: Bundle budget
        run: npm run budget

      - name: Known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high

  install:
    name: Install into fresh Laravel ${{ matrix.laravel }}
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install the package into a fresh Laravel app and boot it
        env:
          LARAVEL: ${{ matrix.laravel }}
        run: bash scripts/verify-install.sh "$LARAVEL" "$RUNNER_TEMP"

  security:
    name: Dependency audit and licenses
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Abandoned packages fail the build only among the runtime dependencies users
      # install. Dev tools are listed without failing: PHPBench (ADR-0016) still
      # needs the abandoned doctrine/annotations.
      - name: Known vulnerabilities in dependencies
        run: composer audit --abandoned=report

      - name: No abandoned runtime dependencies
        run: composer audit --no-dev --abandoned=fail

      - name: Runtime dependency licenses are permissive
        run: composer licenses --no-dev --format=json | php scripts/check-licenses.php

  # The one check to require in branch protection. Job names differ between
  # pull requests and pushes (the matrix changes), so requiring individual
  # jobs would block pull requests forever.
  ci-passed:
    name: CI passed
    if: always()
    needs: [matrix, tests, drivers, mutation-stores, mutation-engine, mutation-changed, static-analysis, code-style, frontend, install, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
