name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full matrix (ADR-0016).
    - cron: '17 3 * * *'
  workflow_dispatch:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Pick the test matrix
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.pick.outputs.run }}
      tests: ${{ steps.pick.outputs.tests }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The nightly run only happens while the repository is public: on a private
          # repository the full matrix every night would use most of the free Actions minutes.
          run=true
          if [ "$EVENT" = "schedule" ] && [ "$(gh api "repos/$REPOSITORY" --jq .private)" = "true" ]; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

          # ADR-0016: pull requests test the lowest and the highest supported versions;
          # pushes to main, nightly and manual runs test the full matrix.
          if [ "$EVENT" = "pull_request" ]; then
            tests='{"include":[{"php":"8.3","laravel":"12","stability":"prefer-lowest"},{"php":"8.5","laravel":"13","stability":"prefer-stable"}]}'
          else
            tests='{"php":["8.3","8.4","8.5"],"laravel":["12","13"],"stability":["prefer-lowest","prefer-stable"]}'
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      # --with intersects with the constraint in composer.json instead of replacing it,
      # so the prefer-lowest job installs the floor that users can actually install.
      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          STABILITY: ${{ matrix.stability }}
        run: composer update "--${STABILITY}" --with "laravel/framework:^${LARAVEL}.0" --prefer-dist --no-interaction --no-progress

      - name: Show resolved versions
        run: composer show --no-ansi | grep -E '^(laravel/framework|orchestra/testbench |pestphp/pest |phpunit/phpunit) '

      - name: Lowest Laravel equals the declared floor (ADR-0019)
        if: matrix.stability == 'prefer-lowest'
        env:
          LARAVEL: ${{ matrix.laravel }}
        run: php scripts/check-laravel-floor.php "$LARAVEL"

      - name: Run tests
        run: composer test

  drivers:
    name: Drivers · PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '12', stability: prefer-lowest }
          - { php: '8.5', laravel: '13', stability: prefer-stable }
    # Same images and ports as docker-compose.yml, so the tests need no extra configuration.
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      memcached:
        image: memcached:1.6-alpine
        ports: ['11211:11211']
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dynamic_throttle
          MYSQL_USER: throttle
          MYSQL_PASSWORD: secret
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports: ['3307:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uthrottle -psecret"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dynamic_throttle
          POSTGRES_USER: throttle
          POSTGRES_PASSWORD: secret
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U throttle -d dynamic_throttle"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, intl, memcached, pcntl, pdo_mysql, pdo_pgsql, redis
          coverage: none
          tools: composer:v2

      - name: Fail if a driver extension is missing
        run: php -r 'foreach (["memcached", "pdo_mysql", "pdo_pgsql", "redis"] as $e) { if (! extension_loaded($e)) { fwrite(STDERR, "Missing ext-$e\n"); exit(1); } }'

      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          STABILITY: ${{ matrix.stability }}
        run: composer update "--${STABILITY}" --with "laravel/framework:^${LARAVEL}.0" --prefer-dist --no-interaction --no-progress

      - name: Run driver tests
        run: composer test:drivers

  mutation:
    name: Mutation testing
    needs: matrix
    # ADR-0016: on pull requests and nightly. Skipped on pushes to main, where the
    # merged pull request already passed it.
    if: needs.matrix.outputs.run == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, pdo_sqlite
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Mutation score of at least 85% for covered classes
        run: composer test:mutate

  static-analysis:
    name: Larastan
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Larastan
        run: composer analyse -- --error-format=github

  code-style:
    name: Code style and repository rules
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: composer format:check

      - name: Rector
        run: composer refactor:check

      - name: No npm toolchain in the package (ADR-0018)
        run: |
          found="$(git ls-files '*package.json' '*package-lock.json' '*yarn.lock' '*pnpm-lock.yaml')"
          if [ -n "$found" ]; then
            echo "::error::ADR-0018: the dashboard uses no npm packages, but the repository contains: $found"
            exit 1
          fi

  install:
    name: Install into fresh Laravel ${{ matrix.laravel }}
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install the package into a fresh Laravel app and boot it
        env:
          LARAVEL: ${{ matrix.laravel }}
        run: bash scripts/verify-install.sh "$LARAVEL" "$RUNNER_TEMP"

  security:
    name: Dependency audit and licenses
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Known vulnerabilities in dependencies
        run: composer audit

      - name: Runtime dependency licenses are permissive
        run: composer licenses --no-dev --format=json | php scripts/check-licenses.php

  # The one check to require in branch protection. Job names differ between
  # pull requests and pushes (the matrix changes), so requiring individual
  # jobs would block pull requests forever.
  ci-passed:
    name: CI passed
    if: always()
    needs: [matrix, tests, drivers, mutation, static-analysis, code-style, install, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
